[workspace]
resolver = "2"
members = [
    "crates/surshape-audio",
    "crates/surshape-engine",
    "crates/surshape-native",
    "crates/surshape-patch",
    "crates/surshape-cdp",
    "crates/surshape-i18n",
    "crates/surshape-session",
    "crates/surshape-app",
    "tools/check_i18n",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
authors = ["Adolfo Rosas (@ahrsml)"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Propias
surshape-audio = { path = "crates/surshape-audio" }
surshape-engine = { path = "crates/surshape-engine" }
surshape-native = { path = "crates/surshape-native" }
surshape-patch = { path = "crates/surshape-patch" }
surshape-cdp = { path = "crates/surshape-cdp" }
surshape-i18n = { path = "crates/surshape-i18n" }
surshape-session = { path = "crates/surshape-session" }
# Proyecto hermano, tal cual (GPL-3.0-or-later, mismo autor)
noisegek-dsp = { path = "../NOISEGEK/vst/noisegek-dsp" }
# Terceros (licencias permitidas; ver THIRD_PARTY.md)
serde = { version = "1", features = ["derive"] }   # MIT/Apache-2.0
serde_json = "1"                                    # MIT/Apache-2.0
symphonia = { version = "0.5.4", default-features = false, features = ["wav", "aiff", "flac", "pcm"] }  # MPL-2.0
hound = "3.5"                                       # Apache-2.0
rustfft = "6"                                       # MIT/Apache-2.0
cpal = "0.15"                                       # Apache-2.0
eframe = { version = "0.31", default-features = false, features = ["glow", "accesskit"] }  # MIT/Apache-2.0
rfd = "0.15"                                        # MIT
dirs = "6"                                          # MIT/Apache-2.0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Los tests corren DSP pesado (stretch): optimizar también en dev/test.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
